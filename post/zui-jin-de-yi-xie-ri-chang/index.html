              <p><img src="/post-images/1778667034018412800_0.jpg" alt="" /><br />
把风扇拆开了，研究了一下里面的构造。<br />
没想到一个几十块的风扇，有这么多定制的部件，看来做一款产品出来确实是很不容易的。<br />
这个风扇拆开清了一下灰和堆积的旧机油，现在开机可以直接启动了，不需要用手拨一下扇叶给个初动力了。</p>
<p>还有就是，最近沉迷王者的鸡爪流了，第一次打上王者20星，对王者甚至是有点上瘾了&hellip;</p>
