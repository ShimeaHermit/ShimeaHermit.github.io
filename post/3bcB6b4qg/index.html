          <div class="post-detail">
            <h2 class="post-title">摆摊的花被收了</h2>
            <div class="post-date">2023-05-07</div>
            
            <div class="post-content" v-pre>
              <p>今晚搭档约我把花放在操场无人售卖，我们把花放在那里后就去逛一逛，拿完快递发现卖出去一束，想着再去看一眼，结果路上看到个老师开着摩托，车上放着我们的花！最后也没追上他。</p>
<p>问了网络中心的师姐说是可能保卫处的人收走的，到保卫处看了一眼，关门了。</p>
<p>第二天去找，发现果然在那，但是那个老师不让我直接拿走，说是要手写600字检讨，还要辅导员跟他的上级廖处约个时间才能拿回去，真麻烦啊。</p>
<p>我加辅导员，辅导员不通过我好友，头疼。</p>
